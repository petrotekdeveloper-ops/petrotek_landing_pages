<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Ten minutes a day adds up</title><desc id="desc">Hypothetical calculation: 10 minutes times 250 working days equals 2,500 minutes divided by 60, or 41.7 hours per year. Not a customer result or promise of recoverable time.</desc>
<rect width="1080" height="1350" fill="#eee9df"/><rect width="1080" height="19" fill="#c83a2e"/><path d="M700 0h380v770L690 1160H300z" fill="#ddd5c7"/>
<circle cx="830" cy="385" r="196" fill="none" stroke="#2b3336" stroke-width="8"/><circle cx="830" cy="385" r="12" fill="#c83a2e"/><path d="M830 385 830 235M830 385 946 437" stroke="#c83a2e" stroke-width="11" stroke-linecap="square"/><path d="M830 162v22m0 402v22M607 385h22m402 0h22M673 228l16 16m282 282 16 16m0-314-16 16M689 526l-16 16" stroke="#626865" stroke-width="6"/>
<text x="75" y="100" fill="#a34b3b" font-family="monospace" font-size="21" letter-spacing="4">05 / A PRODUCTION COST EXAMPLE</text><text x="75" y="245" fill="#21292d" font-family="Arial,sans-serif" font-size="69" font-weight="700">TEN MINUTES</text><text x="75" y="330" fill="#21292d" font-family="Arial,sans-serif" font-size="69" font-weight="700">A DAY</text><text x="75" y="415" fill="#c83a2e" font-family="Arial,sans-serif" font-size="69" font-weight="700">ADDS UP.</text>
<text x="75" y="570" fill="#c83a2e" font-family="Arial,sans-serif" font-size="64" font-weight="700">10 minutes ×</text><text x="75" y="645" fill="#c83a2e" font-family="Arial,sans-serif" font-size="64" font-weight="700">250 working days</text><text x="75" y="720" fill="#21292d" font-family="Arial,sans-serif" font-size="45" font-weight="700">= 41.7 hours / year</text>
<rect x="0" y="820" width="1080" height="530" fill="#222a2e"/><text x="75" y="910" fill="#df946a" font-family="monospace" font-size="20" letter-spacing="2">A HYPOTHETICAL EXAMPLE</text><text x="75" y="970" fill="#f5f0e7" font-family="Arial,sans-serif" font-size="25">Look at the pattern behind the stoppage.</text><text x="75" y="1028" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="21">Meet Petrotek UAE at SteelFab 2027.</text><text x="75" y="1076" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="20">11–14 January 2027  ·  Expo Centre Sharjah</text><text x="75" y="1117" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="20">Hall and stand details to be confirmed.</text><text x="75" y="1156" fill="#df946a" font-family="Arial,sans-serif" font-size="20">petrotek.ae/steelfab-2027/</text>
<path d="M75 1180h930" stroke="#576063"/><text x="75" y="1219" fill="#fff" font-family="Arial,sans-serif" font-size="18">Hypothetical example. This is not a Petrotek customer result or a</text><text x="75" y="1247" fill="#fff" font-family="Arial,sans-serif" font-size="18">promise of recoverable production time.</text><image href="../assets/petrotek-wordmark.png" x="75" y="1260" width="200" height="67" preserveAspectRatio="xMinYMid meet"/>
</svg>
