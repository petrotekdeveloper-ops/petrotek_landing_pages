<text x="76" y="100" fill="#a14a39" font-family="monospace" font-size="21" letter-spacing="4">02 / MACHINERY &amp; BUYING DECISIONS</text>
<text x="76" y="270" fill="#21292d" font-family="Arial,sans-serif" font-size="65" font-weight="700">START WITH</text><text x="76" y="350" fill="#21292d" font-family="Arial,sans-serif" font-size="65" font-weight="700">THE PART</text><text x="76" y="430" fill="#c83a2e" font-family="Arial,sans-serif" font-size="65" font-weight="700">YOU NEED TO</text><text x="76" y="510" fill="#c83a2e" font-family="Arial,sans-serif" font-size="65" font-weight="700">MAKE.</text>
<text x="76" y="605" fill="#56605e" font-family="Arial,sans-serif" font-size="28">Material. Geometry. Tolerance. Batch size.</text><text x="76" y="650" fill="#56605e" font-family="Arial,sans-serif" font-size="28">Your application should shape the machinery</text><text x="76" y="695" fill="#56605e" font-family="Arial,sans-serif" font-size="28">discussion.</text>
