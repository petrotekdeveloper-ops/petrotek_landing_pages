<text x="78" y="102" fill="#df946a" font-family="monospace" font-size="22" letter-spacing="4">03 / LUBRICATION EDUCATION</text><text x="78" y="278" fill="#f3eee5" font-family="Arial,sans-serif" font-size="66" font-weight="700">THE CUTTING</text><text x="78" y="360" fill="#f3eee5" font-family="Arial,sans-serif" font-size="66" font-weight="700">FLUID DESERVES</text><text x="78" y="442" fill="#df946a" font-family="Arial,sans-serif" font-size="66" font-weight="700">A CLOSER LOOK.</text>
<path d="M78 510h90" stroke="#c83a2e" stroke-width="6"/><text x="78" y="592" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="28">Match the fluid to the material, operation</text><text x="78" y="636" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="28">and equipment requirements. Talk to Petrotek</text><text x="78" y="680" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="28">about selection and fluid management.</text>
<rect x="0" y="820" width="1080" height="530" fill="#c83a2e"/><text x="78" y="920" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Explore metalworking fluids with our team.</text><text x="78" y="1010" fill="#fff" font-family="monospace" font-size="21" letter-spacing="2">STEELFAB 2027 / 11–14 JANUARY 2027</text><text x="78" y="1054" fill="#fff" font-family="Arial,sans-serif" font-size="23">Expo Centre Sharjah · UAE</text><text x="78" y="1096" fill="#fff" font-family="Arial,sans-serif" font-size="21">Hall and stand details to be confirmed.</text><text x="78" y="1143" fill="#fff" font-family="Arial,sans-serif" font-size="21">petrotek.ae/steelfab-2027/</text><image href="../assets/petrotek-wordmark.png" x="78" y="1190" width="250" height="84" preserveAspectRatio="xMinYMid meet"/>
