<title id="title">How much compressed air escapes before it works?</title><desc id="desc">The US Department of Energy notes leaks can sometimes waste 20 to 30 percent of compressor output. General industry reference, not a system measurement or savings guarantee.</desc>
<rect width="1080" height="1350" fill="#242c30"/><path d="M0 780h1080v570H0z" fill="#c83a2e"/><path d="M0 0h34v1350H0z" fill="#df946a"/>
<g fill="none" stroke="#718083" stroke-width="20"><path d="M660 340h205v-125h160"/><path d="M660 340v166h365"/></g><g fill="#d98e64"><path d="m780 300 50 40-50 40z"/><path d="m940 465 50 40-50 40z"/></g><g fill="none" stroke="#d98e64" stroke-width="3" opacity=".7"><path d="M820 270c-30-42 33-46 0-86"/><path d="M868 285c-30-42 33-46 0-86"/><path d="M922 405c-30-42 33-46 0-86"/></g>
<text x="78" y="100" fill="#df946a" font-family="monospace" font-size="21" letter-spacing="4">04 / COMPRESSED AIR</text><text x="78" y="225" fill="#f4efe6" font-family="Arial,sans-serif" font-size="48" font-weight="700">HOW MUCH COMPRESSED AIR</text><text x="78" y="286" fill="#f4efe6" font-family="Arial,sans-serif" font-size="48" font-weight="700">ESCAPES BEFORE IT WORKS?</text>
<text x="78" y="605" fill="#df946a" font-family="Arial,sans-serif" font-size="160" font-weight="700" letter-spacing="-8">20–30%</text><text x="78" y="668" fill="#f4efe6" font-family="Arial,sans-serif" font-size="26">The US Department of Energy notes that leaks can sometimes</text><text x="78" y="710" fill="#f4efe6" font-family="Arial,sans-serif" font-size="26">waste this share of a compressor’s output in industrial compressed</text><text x="78" y="752" fill="#f4efe6" font-family="Arial,sans-serif" font-size="26">air systems.</text>
<text x="78" y="860" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700">Discuss your compressed air requirements with Petrotek UAE.</text><text x="78" y="940" fill="#fff" font-family="monospace" font-size="19" letter-spacing="2">STEELFAB 2027  /  11–14 JANUARY</text><text x="78" y="977" fill="#fff" font-family="Arial,sans-serif" font-size="22">Expo Centre Sharjah · UAE</text><text x="78" y="1015" fill="#fff" font-family="Arial,sans-serif" font-size="20">Hall and stand details to be confirmed.</text><text x="78" y="1052" fill="#fff" font-family="Arial,sans-serif" font-size="20">petrotek.ae/steelfab-2027/</text>
<path d="M78 1080h920" stroke="#f3c3a5" stroke-opacity=".65"/><text x="78" y="1120" fill="#fff" font-family="Arial,sans-serif" font-size="19">General industry reference, not a measurement of your system or a</text><text x="78" y="1149" fill="#fff" font-family="Arial,sans-serif" font-size="19">Petrotek savings guarantee. Source: US DOE, Improving Compressed</text><text x="78" y="1178" fill="#fff" font-family="Arial,sans-serif" font-size="19">Air System Performance, section on compressed air system leaks.</text>
