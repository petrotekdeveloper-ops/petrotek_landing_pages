<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Make time for a useful technical conversation</title><desc id="desc">Arrange a meeting with Petrotek UAE at SteelFab 2027, 11–14 January at Expo Centre Sharjah. Hall and stand to be confirmed.</desc>
<rect width="1080" height="1350" fill="#222a2e"/><path d="M0 0h1080v790L300 1350H0z" fill="#2e373a"/><path d="M0 0h22v1350H0z" fill="#c83a2e"/>
<g fill="none" stroke="#d98e64" opacity=".55"><path d="M735 170h210v210H735z" transform="rotate(45 840 275)" stroke-width="2"/><path d="M735 230h210v210H735z" transform="rotate(45 840 335)"/><path d="M735 290h210v210H735z" transform="rotate(45 840 395)"/><path d="M735 350h210v210H735z" transform="rotate(45 840 455)"/></g>
<text x="76" y="100" fill="#df946a" font-family="monospace" font-size="21" letter-spacing="4">06 / MEETING INVITATION</text><text x="76" y="255" fill="#f5f0e7" font-family="Arial,sans-serif" font-size="67" font-weight="700">MAKE TIME</text><text x="76" y="338" fill="#f5f0e7" font-family="Arial,sans-serif" font-size="67" font-weight="700">FOR A USEFUL</text><text x="76" y="421" fill="#df946a" font-family="Arial,sans-serif" font-size="67" font-weight="700">TECHNICAL</text><text x="76" y="504" fill="#df946a" font-family="Arial,sans-serif" font-size="67" font-weight="700">CONVERSATION.</text>
<text x="76" y="600" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="25">Reviewing machinery, metalworking fluids or compressed</text><text x="76" y="642" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="25">air? Tell us your area of interest and arrange a meeting</text><text x="76" y="684" fill="#d4d5d0" font-family="Arial,sans-serif" font-size="25">with Petrotek UAE at SteelFab 2027.</text>
<rect x="0" y="790" width="1080" height="560" fill="#c83a2e"/><text x="76" y="900" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Arrange your meeting at</text><text x="76" y="947" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">petrotek.ae/steelfab-2027/</text><text x="76" y="1040" fill="#fff" font-family="monospace" font-size="22" letter-spacing="2">11–14 JANUARY 2027</text><text x="76" y="1084" fill="#fff" font-family="Arial,sans-serif" font-size="25">Expo Centre Sharjah · UAE</text><text x="76" y="1128" fill="#fff" font-family="Arial,sans-serif" font-size="22">Hall and stand details to be confirmed.</text><image href="../assets/petrotek-wordmark.png" x="76" y="1190" width="260" height="90" preserveAspectRatio="xMinYMid meet"/>
</svg>
