kind = "web"
previewPath = "/"
title = "Petrotek at SteelFab 2027"
description = "A campaign landing page for Petrotek UAE at SteelFab 2027, presenting verified solution areas, meeting enquiries, educational content, and event campaign materials."
version = "1.0.0"
id = "artifacts/petrotek-steelfab-2027"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20151

[services.development]
run = "pnpm --filter @workspace/petrotek-steelfab-2027 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petrotek-steelfab-2027", "run", "build" ]
serve = "static"
publicDir = "artifacts/petrotek-steelfab-2027/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20151"
BASE_PATH = "/"
